# Module 24: run the bookstore against PostgreSQL.
#   docker compose up --build
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: bookstore
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/bookstore
      DB_USER: bookstore
      DB_PASSWORD: bookstore
      APP_JWT_SECRET: change-this-local-secret-to-something-long-and-random
    ports:
      - "8080:8080"
