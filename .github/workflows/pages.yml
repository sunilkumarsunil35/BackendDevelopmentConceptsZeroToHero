# Publishes tracker/index.html to GitHub Pages, so the tracker also works without claude.ai.
# One-time setup: repository Settings > Pages > Source: GitHub Actions.
name: Tracker on GitHub Pages

on:
  push:
    branches: [main]
    paths: [tracker/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tracker
      - id: deployment
        uses: actions/deploy-pages@v4
